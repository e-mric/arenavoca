name: Web verification
on:
  pull_request:
    paths: ["app/**", "scripts/verify.sh", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "scripts/verify.sh", ".github/workflows/app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: bash scripts/verify.sh app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
