name: Documentation verification
on:
  pull_request:
    paths: ["**/*.md", "scripts/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["**/*.md", "scripts/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check shared guidance and changed Markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          files=()
          if [[ -n "${BASE_SHA//0/}" ]]; then
            mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- '*.md')
          fi
          bash scripts/verify.sh docs "${files[@]}"
