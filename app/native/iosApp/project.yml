name: ArenaVoca
options:
  bundleIdPrefix: com.arenavoca
  deploymentTarget:
    iOS: "17.0"
targets:
  ArenaVoca:
    type: application
    platform: iOS
    sources:
      - ../../src/features/recap/native/iosMain
      - ../../src/features/stories/native/iosMain
      - path: ../../src/features/recap/artwork/res/drawable-nodpi
        buildPhase: resources
      - path: ../../src/features/stories/artwork/res/drawable-nodpi
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arenavoca.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        COMPRESS_PNG_FILES: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ArenaVocaShared"
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  ArenaVocaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../../src/features/recap/native/iosTest
      - ../../src/features/stories/native/iosTest
    dependencies:
      - target: ArenaVoca
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        COMPRESS_PNG_FILES: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.arenavoca.mobile.uitests
schemes:
  ArenaVoca:
    build:
      targets:
        ArenaVoca: all
    test:
      targets:
        - ArenaVocaUITests
